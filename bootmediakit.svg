<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202d46"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67d6f5"/>
      <stop offset="0.52" stop-color="#438ee8"/>
      <stop offset="1" stop-color="#655de6"/>
    </linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf7ff"/>
      <stop offset="1" stop-color="#a9c7df"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="236" height="236" rx="58" fill="url(#background)"/>
  <path d="M40 63C65 27 119 14 164 28" fill="none" stroke="#8be5ff" stroke-opacity=".13" stroke-width="9" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <!-- USB connector -->
    <rect x="91" y="39" width="74" height="51" rx="13" fill="url(#plug)"/>
    <rect x="103" y="26" width="16" height="26" rx="4" fill="#f4bd57"/>
    <rect x="137" y="26" width="16" height="26" rx="4" fill="#f4bd57"/>
    <path d="M98 78H158" stroke="#7291ad" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>

    <!-- Flash drive body -->
    <rect x="66" y="76" width="124" height="139" rx="29" fill="url(#body)" stroke="#b6edff" stroke-opacity=".55" stroke-width="3"/>
    <path d="M82 91V178" stroke="#ffffff" stroke-opacity=".16" stroke-width="7" stroke-linecap="round"/>
    <path d="M174 93V139" stroke="#101827" stroke-opacity=".12" stroke-width="7" stroke-linecap="round"/>

    <!-- Boot / upward transfer mark -->
    <path d="M128 167V112M105 135L128 111L151 135" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M105 178H151" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity=".94"/>

    <!-- Device status light -->
    <circle cx="166" cy="194" r="7" fill="#a7f3d0" stroke="#eafff5" stroke-width="2"/>
  </g>
</svg>
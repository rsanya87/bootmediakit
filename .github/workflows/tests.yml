name: Tests

on:
  push:
    branches:
      - main
      - "dev/**"
      - "release/**"
      - "baseline/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-and-unit:
    name: Python and shell checks
    runs-on: ubuntu-latest
    # A normal run takes about a minute; a hung package download must not
    # hold the runner for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The package mirrors sometimes fail transiently (DNS errors, or a 404
      # when the index changes during the run). Each attempt refreshes the
      # index first; after the last failed attempt the step fails as before.
      - name: Install system and Python test dependencies
        timeout-minutes: 20
        run: |
          packages="libegl1 libgl1 ntfs-3g dosfstools shellcheck fdisk parted e2fsprogs p7zip-full grub-pc-bin grub2-common qemu-system-x86"
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y $packages; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::apt-get failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::apt-get attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          python -m pip install --disable-pip-version-check PySide6
      - name: Compile Python files
        run: python -m py_compile app.py worker.py iso_utils.py ui_helpers.py fetch_uefi_ntfs.py version.py
      - name: Check shell syntax
        run: bash -n install.sh uninstall.sh bootmediakit-worker
      - name: Lint shell scripts with shellcheck
        run: shellcheck -S warning install.sh uninstall.sh bootmediakit-worker
      - name: Fetch and verify the pinned UEFI:NTFS helper image
        run: python fetch_uefi_ntfs.py "$RUNNER_TEMP/uefi-ntfs.img"
      - name: Report verified helper SHA-256
        run: sha256sum "$RUNNER_TEMP/uefi-ntfs.img"
      - name: Validate NTFS formatting arguments on a temporary image
        run: |
          truncate -s 64M "$RUNNER_TEMP/ntfs-test.img"
          mkfs.ntfs --no-action --fast --force --label BOOTMEDIA --partition-start 2048 --sector-size 512 --heads 255 --sectors-per-track 63 --cluster-size 4096 "$RUNNER_TEMP/ntfs-test.img"
      - name: Verify upstream FAT helper label can be branded without changing the source image
        run: |
          cp "$RUNNER_TEMP/uefi-ntfs.img" "$RUNNER_TEMP/uefi-ntfs-bmk.img"
          test "$(fatlabel "$RUNNER_TEMP/uefi-ntfs.img")" = "RUFUS_BOOT"
          fatlabel "$RUNNER_TEMP/uefi-ntfs-bmk.img" BMK_EFI
          test "$(fatlabel "$RUNNER_TEMP/uefi-ntfs-bmk.img")" = "BMK_EFI"
          test "$(stat -c %s "$RUNNER_TEMP/uefi-ntfs-bmk.img")" = "1048576"
          sha256sum "$RUNNER_TEMP/uefi-ntfs.img" "$RUNNER_TEMP/uefi-ntfs-bmk.img"
      - name: Run unit and offscreen GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      # The runner's sudo does not pass a step's env: block through "sudo -E"
      # (seen on ubuntu-26.04), so the variables are given to env after sudo.
      - name: Check that the root test process receives the integration variables
        run: >-
          sudo env BMK_INTEGRATION_REQUIRED=1 BMK_QEMU=1 BMK_UEFI_NTFS_IMAGE="$RUNNER_TEMP/uefi-ntfs.img"
          python3 -I -c 'import os, sys;
          e = os.environ;
          bad = [k for k in ("BMK_INTEGRATION_REQUIRED", "BMK_QEMU") if e.get(k) != "1"];
          bad += [] if os.path.isfile(e.get("BMK_UEFI_NTFS_IMAGE", "")) else ["BMK_UEFI_NTFS_IMAGE"];
          bad += [] if os.geteuid() == 0 else ["root"];
          sys.exit("missing under sudo: " + ", ".join(bad)) if bad else print("root test environment OK")'
      - name: Run loop-device integration tests as root
        run: sudo env BMK_INTEGRATION_REQUIRED=1 BMK_QEMU=1 BMK_UEFI_NTFS_IMAGE="$RUNNER_TEMP/uefi-ntfs.img" BMK_INTEGRATION=1 QT_QPA_PLATFORM=offscreen python3 -m unittest discover -s tests/integration -v

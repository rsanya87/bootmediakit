name: Tests

on:
  push:
    branches:
      - main
      - "dev/**"
      - "baseline/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-and-unit:
    name: Python and shell checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m py_compile app.py worker.py iso_utils.py fetch_uefi_ntfs.py
      - name: Check shell syntax
        run: bash -n install.sh uninstall.sh
      - name: Fetch and verify the pinned UEFI:NTFS helper image
        run: python fetch_uefi_ntfs.py "$RUNNER_TEMP/uefi-ntfs.img"
      - name: Report verified helper SHA-256
        run: sha256sum "$RUNNER_TEMP/uefi-ntfs.img"
      - name: Install NTFS format utility for a dry-run check
        run: |
          sudo apt-get update
          sudo apt-get install -y ntfs-3g
      - name: Validate NTFS formatting arguments on a temporary image
        run: |
          truncate -s 64M "$RUNNER_TEMP/ntfs-test.img"
          mkfs.ntfs --no-action --fast --force --label BOOTMEDIA --partition-start 2048 --sector-size 512 "$RUNNER_TEMP/ntfs-test.img"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

name: Tests

on:
  push:
    branches:
      - main
      - "dev/**"
      - "baseline/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-and-unit:
    name: Python and shell checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m py_compile app.py worker.py iso_utils.py fetch_uefi_ntfs.py
      - name: Check shell syntax
        run: bash -n install.sh uninstall.sh
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
